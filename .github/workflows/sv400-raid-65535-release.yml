name: Build and release SV400 single-instruction IPS

on:
  push:
    branches:
      - sv400-raid-damage-65535-ips
    paths:
      - 'tools/build_sv400_raid_damage_ips.py'
      - 'tests/test_sv400_raid_damage_ips.py'
      - 'docs/SV400_Always65535Damage_IPS.md'
      - '.github/workflows/sv400-raid-65535-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test patch and generator
        run: python -m unittest discover -s tests -p 'test_sv400_raid_damage_ips.py' -v
      - name: Build IPS32 and installable ZIP
        run: python tools/build_sv400_raid_damage_ips.py --output-dir dist
      - name: Inspect generated release asset
        run: |
          sha256sum dist/atmosphere/exefs_patches/SV400_Always65535Damage/*.ips
          unzip -l dist/Pokemon_Violet_4.0.0_Always65535Damage_IPS.zip
      - name: Publish branch-specific release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="sv400-raid-65535-v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            dist/Pokemon_Violet_4.0.0_Always65535Damage_IPS.zip \
            --target "$GITHUB_SHA" \
            --title "Violet 4.0.0 - always 65535 damage IPS (build ${GITHUB_RUN_NUMBER})" \
            --notes "Single-instruction IPS32 at main+0x1536214. Unconditional/global change, not raid-only; not validated in-game. Violet 4.0.0 Build ID 709bfd66115298640155fcc4979dba151c7cc79a. No Scarlet patch." \
            --latest
