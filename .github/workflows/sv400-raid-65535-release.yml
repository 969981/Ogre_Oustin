name: Build and release SV400 Scarlet/Violet IPS32 packages

on:
  push:
    branches:
      - sv400-raid-damage-65535-ips
    paths:
      - 'tools/build_sv400_raid_damage_ips.py'
      - 'tools/package_sv400_ryujinx.py'
      - 'tools/package_sv400_four.py'
      - 'tests/test_sv400_ryujinx.py'
      - 'tests/test_sv400_four.py'
      - 'docs/SV400_Release_Layout.md'
      - 'tests/test_sv400_raid_damage_ips.py'
      - 'docs/SV400_Always65535Damage_IPS.md'
      - '.github/workflows/sv400-raid-65535-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test patch and generator
        run: python -m unittest discover -s tests -p 'test_sv400_*.py' -v
      - name: Build IPS32 and installable ZIP
        run: python tools/build_sv400_raid_damage_ips.py --output-dir dist
      - name: Build portable Ryujinx mod package
        run: python tools/package_sv400_ryujinx.py --output-dir dist
      - name: Build four separately installable packages
        run: python tools/package_sv400_four.py --output-dir dist
      - name: Inspect generated release asset
        run: |
          sha256sum dist/atmosphere/exefs_patches/SV400_Always65535Damage/*.ips
          unzip -l dist/Pokemon_Violet_4.0.0_Always65535Damage_IPS.zip
          unzip -l dist/Pokemon_Violet_4.0.0_Ryujinx_65535_IPS.zip
          for f in dist/Pokemon_*_4.0.0_*_65535*.zip; do echo "Verify $f"; unzip -t "$f"; done
      - name: Publish branch-specific release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="sv400-raid-65535-v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            dist/Pokemon_Scarlet_4.0.0_Atmosphere_65535_CANDIDATE.zip \
            dist/Pokemon_Scarlet_4.0.0_Ryujinx_65535_CANDIDATE.zip \
            dist/Pokemon_Violet_4.0.0_Atmosphere_65535.zip \
            dist/Pokemon_Violet_4.0.0_Ryujinx_65535.zip \
            --target "$GITHUB_SHA" \
            --title "SV 4.0.0 - Scarlet/Violet Atmosphere + Ryujinx IPS32 (build ${GITHUB_RUN_NUMBER})" \
            --notes "Four separate ZIPs for Scarlet/Violet 4.0.0 and Atmosphere/Ryujinx. Scarlet is an UNVERIFIED CANDIDATE with guessed same RVA as Violet; no Scarlet original NSO verification. Violet instruction is verified statically, but gameplay effects are not established for either game. Changes a single instruction globally and unconditionally, NOT raid-only and NOT guaranteed one-hit KO. Offline tests only, back up saves. See docs/SV400_Release_Layout.md." \
            --latest
